services:
  nanoshare:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - data:/app/data
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  nanoshare_net:
    driver: bridge

volumes:
  data:
